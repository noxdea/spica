name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.4'
          bundler: default
          bundler-cache: true
      - run: bundle exec rake demo
      - run: git diff --exit-code -- docs/media
      - run: bundle exec rake demo
      - run: git diff --exit-code -- docs/media
      - run: test "$(stat -c%s docs/media/screenshot.png)" -le 512000
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
        env:
          FZY_REQUIRED: ${{ runner.os == 'Linux' && '1' || '0' }}
      - run: gem build spica.gemspec
      - if: runner.os == 'Linux' && matrix.ruby == '4.0'
        run: BUDGET=1 bundle exec rake bench
